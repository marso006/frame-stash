modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/marso006/frame-stash/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
logoFile = "assets/frame_stash/icon.png"
displayURL = "https://github.com/marso006/frame-stash"
description = '''
Label chests with item frames, then quick stack, restock and overflow into them. Server-side; vanilla clients can join.
'''
# Server-only mod: clients never need it, so the server list must not flag a mismatch.
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.10,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.10,1.21.11)"
ordering = "NONE"
side = "BOTH"
